# Installed by server-setup.sh only while no certificate exists, so that
# `certbot certonly --webroot` can answer the HTTP-01 challenge.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/__APP_SLUG__;
    }

    location / {
        return 404;
    }
}
